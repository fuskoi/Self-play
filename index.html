<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>我的资源库</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js" defer></script>
    <script src="data.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body class="is-locked">
    <div class="bg" aria-hidden="true"></div>

    <!-- 密码门 -->
    <section id="gate" class="gate" aria-labelledby="gate-title">
      <div class="gate-card">
        <p class="gate-brand" id="gate-brand">我的资源库</p>
        <h1 id="gate-title">输入密码进入</h1>
        <p class="gate-sub">私人空间，仅限本人访问</p>
        <form id="gate-form" autocomplete="off">
          <label class="sr-only" for="password">密码</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="请输入访问密码"
            required
            autofocus
          />
          <button type="submit">进入</button>
          <p id="gate-error" class="gate-error" hidden>密码不正确，请重试</p>
        </form>
      </div>
    </section>

    <!-- 主界面 -->
    <div id="app" class="app" hidden>
      <header class="top">
        <div class="top-text">
          <p class="brand" id="brand">我的资源库</p>
          <p class="tagline" id="tagline">私人链接 · 全设备同步</p>
          <p id="sync-status" class="sync-status" hidden></p>
        </div>
        <div class="top-actions">
          <button type="button" id="btn-bg" class="btn icon-btn" title="背景设置" aria-label="背景设置">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="currentColor"
                d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-4.6l1.3 2H17a1 1 0 1 1 0 2H7a1 1 0 1 1 0-2h2.3l1.3-2H6a2 2 0 0 1-2-2V5zm2 0v7h12V5H6zm2.5 2.2a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6zM7.2 12l2.4-2.5 1.6 1.5 2.5-2.8L16.8 12H7.2z"
              />
            </svg>
          </button>
          <button type="button" id="btn-random" class="btn ghost">随机一张</button>
          <button type="button" id="btn-add" class="btn ghost">添加</button>
          <button type="button" id="btn-manage" class="btn ghost">管理</button>
          <button type="button" id="btn-lock" class="btn ghost">锁定</button>
        </div>
      </header>

      <div class="controls">
        <div class="tabs" role="tablist" aria-label="分类">
          <button type="button" class="tab active" data-cat="全部">全部</button>
          <button type="button" class="tab" data-cat="收藏">收藏</button>
          <button type="button" class="tab" data-cat="办公">办公</button>
          <button type="button" class="tab" data-cat="工具">工具</button>
          <button type="button" class="tab" data-cat="系统">系统</button>
          <button type="button" class="tab" data-cat="游戏">游戏</button>
          <button type="button" class="tab" data-cat="galgame">galgame</button>
          <button type="button" class="tab" data-cat="影视">影视</button>
          <button type="button" class="tab" data-cat="音乐">音乐</button>
          <button type="button" class="tab" data-cat="学习">学习</button>
          <button type="button" class="tab" data-cat="书籍">书籍</button>
          <button type="button" class="tab" data-cat="设计">设计</button>
          <button type="button" class="tab" data-cat="资料">资料</button>
          <button type="button" class="tab" data-cat="手机">手机</button>
          <button type="button" class="tab" data-cat="其他">其他</button>
        </div>

        <div id="tag-filters" class="tag-filters" hidden></div>

        <div class="toolbar-row">
          <label class="search">
            <span class="sr-only">搜索</span>
            <input id="search" type="search" placeholder="搜索名称、标签、备注…" />
          </label>
          <div class="sort-picker" role="group" aria-label="排序">
            <button type="button" class="sort-option active" data-sort="added">添加顺序</button>
            <button type="button" class="sort-option" data-sort="name">名称</button>
          </div>
        </div>
      </div>

      <p id="count" class="count"></p>
      <main id="grid" class="grid" aria-live="polite"></main>
      <p id="empty" class="empty" hidden>没有匹配的资源，换个关键词试试</p>
      <nav id="pager" class="pager" aria-label="分页" hidden>
        <button type="button" id="btn-first" class="pager-btn">首页</button>
        <button type="button" id="btn-prev" class="pager-btn">上一页</button>
        <span id="page-info" class="page-info"></span>
        <button type="button" id="btn-next" class="pager-btn">下一页</button>
        <button type="button" id="btn-last" class="pager-btn">尾页</button>
      </nav>
    </div>

    <!-- 统一管理 -->
    <dialog id="manager" class="manager">
      <div class="manager-inner">
        <div class="manager-head">
          <div>
            <h2>管理资源</h2>
            <p class="manager-sub">备份与批量处理</p>
          </div>
          <button type="button" id="btn-manager-close" class="btn ghost">完成</button>
        </div>

        <section class="manager-panel">
          <h3>云端同步</h3>
          <p id="remote-tip" class="panel-note">未配置云端时，数据只保存在本机。免费云端约 100KB：封面请尽量用图片链接，本机上传的大图不会上传云端。</p>
          <div class="manager-actions">
            <button type="button" id="btn-sync-now" class="btn ghost">立即同步</button>
          </div>
        </section>

        <section class="manager-panel">
          <h3>数据备份</h3>
          <div class="manager-actions">
            <button type="button" id="btn-export" class="btn ghost">导出备份</button>
            <button type="button" id="btn-import" class="btn ghost">合并导入</button>
            <button type="button" id="btn-import-replace" class="btn ghost">覆盖导入</button>
            <input id="import-file" type="file" accept="application/json,.json" hidden />
          </div>
        </section>

        <div class="manager-list-head">
          <h3>全部资源</h3>
          <button type="button" id="btn-batch-toggle" class="btn ghost">批量操作</button>
        </div>

        <div id="batch-bar" class="batch-bar" hidden>
          <label class="batch-check">
            <input type="checkbox" id="batch-select-all" />
            全选
          </label>
          <select id="batch-category" aria-label="批量分类">
            <option value="">改分类…</option>
            <option value="办公">办公</option>
            <option value="工具">工具</option>
            <option value="系统">系统</option>
            <option value="游戏">游戏</option>
            <option value="galgame">galgame</option>
            <option value="影视">影视</option>
            <option value="音乐">音乐</option>
            <option value="学习">学习</option>
            <option value="书籍">书籍</option>
            <option value="设计">设计</option>
            <option value="资料">资料</option>
            <option value="手机">手机</option>
            <option value="其他">其他</option>
          </select>
          <button type="button" id="btn-batch-category" class="btn ghost">应用分类</button>
          <button type="button" id="btn-batch-pin" class="btn ghost">收藏</button>
          <button type="button" id="btn-batch-unpin" class="btn ghost">取消收藏</button>
          <button type="button" id="btn-batch-delete" class="btn ghost danger-text">删除</button>
          <span id="batch-count" class="batch-count">已选 0</span>
        </div>

        <div id="manager-list" class="manager-list"></div>
        <p id="manager-empty" class="empty" hidden>还没有资源，先去添加吧</p>
      </div>
    </dialog>

    <!-- 背景设置（仅本机） -->
    <dialog id="bg-dialog" class="bg-dialog">
      <div class="bg-dialog-inner">
        <div class="bg-dialog-head">
          <div>
            <h2>背景设置</h2>
            <p>仅保存在本机浏览器，其他设备互不影响</p>
          </div>
          <button type="button" id="btn-bg-close" class="btn ghost">完成</button>
        </div>
        <label class="dim-control">
          <span>背景遮罩</span>
          <input id="bg-dim" type="range" min="30" max="85" value="62" />
        </label>
        <div class="bg-custom">
          <span class="field-caption">自定义背景</span>
          <label class="file-picker" for="bg-file">
            <input id="bg-file" type="file" accept="image/*" />
            <span class="file-btn">选择图片</span>
            <span class="file-name" id="bg-file-name">使用网站默认</span>
          </label>
          <button type="button" id="btn-bg-reset" class="btn ghost">恢复默认</button>
        </div>
      </div>
    </dialog>

    <!-- 随机一张 -->
    <dialog id="random-dialog" class="random-dialog">
      <div class="random-inner">
        <div id="random-card" class="random-card"></div>
        <div class="random-actions">
          <button type="button" id="btn-random-again" class="btn ghost">再随机</button>
          <button type="button" id="btn-random-close" class="btn primary">关闭</button>
        </div>
      </div>
    </dialog>

    <!-- 添加 / 编辑 -->
    <dialog id="editor" class="editor">
      <form method="dialog" id="editor-form" class="editor-form">
        <div class="editor-head">
          <div>
            <h2 id="editor-title">添加资源</h2>
            <p class="editor-sub">填写名字、封面和网盘链接</p>
          </div>
          <button type="button" id="btn-cancel" class="btn ghost">取消</button>
        </div>

        <input type="hidden" id="edit-id" />
        <input type="hidden" id="edit-image-data" />
        <input type="hidden" id="edit-pinned" value="0" />

        <div class="editor-scroll">
          <section class="editor-panel">
            <h3>基本信息</h3>
            <div class="editor-grid">
              <label class="span-2">
                名字
                <input id="edit-title" required maxlength="60" placeholder="例如：某某软件" />
              </label>
              <label>
                标签（逗号分隔）
                <input id="edit-tags" maxlength="120" placeholder="完结, 汉化, 待看" />
              </label>
              <label>
                备注
                <input id="edit-note" maxlength="80" placeholder="可选" />
              </label>
              <div class="pin-check span-2">
                <input type="checkbox" id="edit-pin-check" />
                <label for="edit-pin-check">收藏并置顶</label>
              </div>
            </div>
          </section>

          <section class="editor-panel">
            <h3>封面图片</h3>
            <div class="cover-layout">
              <div class="cover-fields">
                <label>
                  图片链接
                  <input
                    id="edit-image"
                    type="text"
                    inputmode="url"
                    placeholder="https://... 图片地址"
                  />
                </label>
                <div class="file-field">
                  <span class="field-caption">或从本机选择</span>
                  <label class="file-picker" for="edit-image-file">
                    <input id="edit-image-file" type="file" accept="image/*" />
                    <span class="file-btn">选择文件</span>
                    <span class="file-name" id="edit-image-file-name">未选择文件</span>
                  </label>
                </div>
              </div>
              <div id="image-preview" class="image-preview" hidden>
                <img id="image-preview-img" alt="预览" />
                <button type="button" id="btn-clear-image" class="btn ghost">清除</button>
              </div>
            </div>
          </section>

          <section class="editor-panel">
            <div class="links-head">
              <h3>网盘链接</h3>
              <button type="button" id="btn-add-link" class="btn ghost">加一条</button>
            </div>
            <div id="links-editor" class="links-editor"></div>
          </section>

          <section class="editor-panel">
            <h3>分类</h3>
            <input type="hidden" id="edit-category" value="办公" required />
            <div class="cat-picker" role="group" aria-label="分类">
              <button type="button" class="cat-option active" data-value="办公">办公</button>
              <button type="button" class="cat-option" data-value="工具">工具</button>
              <button type="button" class="cat-option" data-value="系统">系统</button>
              <button type="button" class="cat-option" data-value="游戏">游戏</button>
              <button type="button" class="cat-option" data-value="galgame">galgame</button>
              <button type="button" class="cat-option" data-value="影视">影视</button>
              <button type="button" class="cat-option" data-value="音乐">音乐</button>
              <button type="button" class="cat-option" data-value="学习">学习</button>
              <button type="button" class="cat-option" data-value="书籍">书籍</button>
              <button type="button" class="cat-option" data-value="设计">设计</button>
              <button type="button" class="cat-option" data-value="资料">资料</button>
              <button type="button" class="cat-option" data-value="手机">手机</button>
              <button type="button" class="cat-option" data-value="其他">其他</button>
            </div>
          </section>
        </div>

        <div class="editor-footer">
          <p class="editor-tip">内容保存在当前浏览器，换设备前可先导出备份。</p>
          <button type="submit" class="btn primary" value="save">保存</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
